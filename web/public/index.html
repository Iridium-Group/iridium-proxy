<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iridium</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#171717" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#efefef" media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // Remember anything that fails while the page's scripts load, so the page can say what went wrong.
      window.__loadErrors = [];
      addEventListener(
        'error',
        function (e) {
          var t = e.target;
          window.__loadErrors.push(
            t && t.src
              ? 'could not load ' + t.src.split('/').slice(3).join('/')
              : (e.message || 'error') +
                  (e.filename ? ' (' + e.filename.split('/').pop() + ')' : ''),
          );
        },
        true,
      );
    </script>
    <script src="config.js"></script>
    <script src="/scramjet/scramjet.js"></script>
    <script src="/controller/controller.api.js"></script>
    <script src="/libcurl/index.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header>
      <strong>Iridium</strong>
      <form id="form">
        <input
          id="address"
          type="text"
          placeholder="Search or enter a URL"
          autocomplete="off"
          autofocus
        />
        <button>Go</button>
      </form>
    </header>
    <p id="status" role="status"></p>
    <main id="stage"></main>
    <footer>
      <a href="https://github.com/Iridium-Group/iridium-proxy/tree/main/web">Source (AGPL-3.0)</a>
      · <a href="/THIRD_PARTY_LICENSES.txt">Third-party licenses</a>
    </footer>
  </body>
</html>
