<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Klyro</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0d12'/%3E%3Cpath d='M9 7v18M9 16l9-9M9 16l9 9' stroke='%238b93ff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="klyro.css" />
  </head>
  <body>
    <main>
      <h1>KLYRO</h1>
      <form id="go" autocomplete="off">
        <input
          id="url"
          type="text"
          inputmode="url"
          spellcheck="false"
          placeholder="Enter URL"
          aria-label="Enter URL"
          autofocus
        />
        <button type="submit">GO</button>
      </form>
      <p id="note" role="status"></p>

      <section>
        <h2>Recent</h2>
        <ul id="recent"></ul>
      </section>
      <section>
        <h2>Favorites</h2>
        <ul id="favorites"></ul>
        <button id="fav" type="button" class="link">+ add the address above</button>
      </section>
      <section>
        <h2>Settings</h2>
        <label
          ><input id="keep" type="checkbox" checked /> remember recent addresses on this
          device</label
        >
        <button id="clear" type="button" class="link">clear recent and favorites</button>
      </section>
    </main>
    <footer>
      Klyro by Iridium Group · does not handle sign-ins · <a href="/metrics">metrics</a> ·
      <a href="https://github.com/Iridium-Group/iridium-proxy">source</a>
    </footer>
    <script src="klyro.js"></script>
  </body>
</html>
